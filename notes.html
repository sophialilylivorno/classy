<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notes — Classy</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8f3ee;
    color: #4d4642;
    min-height: 100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 220px;
    background: #fffaf6;
    border-right: 1px solid #eadfd7;
    padding: 28px 18px;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    color: #b77d7d;
    margin-left: 8px;
}

.tagline {
    font-size: 11px;
    color: #a69a94;
    margin: 4px 8px 30px;
}

.nav a {
    display: block;
    text-decoration: none;
    color: #6f6661;
    font-size: 14px;
    padding: 11px 12px;
    border-radius: 10px;
    margin-bottom: 5px;
}

.nav a:hover,
.nav a.active {
    background: #f0ddd7;
    color: #a66f70;
}

/* =========================
   MAIN
========================= */

.main {
    margin-left: 220px;
    padding: 45px;
    min-height: 100vh;
}

.topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 28px;
}

h1 {
    margin: 0;
    font-size: 30px;
    color: #4d4642;
}

.subtitle {
    margin: 7px 0 0;
    color: #948884;
    font-size: 14px;
}

/* =========================
   NEW NOTE BUTTON
========================= */

.new-note-button {
    border: none;
    background: #c98787;
    color: white;
    padding: 12px 18px;
    border-radius: 11px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.new-note-button:hover {
    background: #b87878;
}

/* =========================
   SEARCH + FILTER
========================= */

.toolbar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
}

.search {
    flex: 1;
    min-width: 220px;
    padding: 12px 14px;
    border: 1px solid #eadfd7;
    border-radius: 11px;
    background: #fffdfb;
    color: #4d4642;
    outline: none;
}

.search:focus {
    border-color: #c9aaa4;
}

.filter {
    min-width: 190px;
    padding: 12px 14px;
    border: 1px solid #eadfd7;
    border-radius: 11px;
    background: #fffdfb;
    color: #5e5651;
    outline: none;
}

/* =========================
   NOTES GRID
========================= */

.notes-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
}

.note-card {
    background: #fffdfb;
    border: 1px solid #eadfd7;
    border-radius: 18px;
    padding: 20px;
    min-height: 210px;
    box-shadow: 0 7px 22px rgba(87,70,61,.055);
    display: flex;
    flex-direction: column;
}

.note-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(87,70,61,.08);
    transition: .15s ease;
}

.course-pill {
    align-self: flex-start;
    padding: 5px 9px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: bold;
    margin-bottom: 13px;
}

.note-title {
    margin: 0 0 9px;
    font-size: 17px;
    color: #4d4642;
    line-height: 1.3;
}

.note-preview {
    color: #8c817b;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow: hidden;

    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
}

.note-date {
    margin-top: auto;
    padding-top: 17px;
    color: #aaa09a;
    font-size: 10px;
}

.note-actions {
    display: flex;
    gap: 7px;
    margin-top: 13px;
}

.small-button {
    border: none;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
}

.edit-button {
    background: #eee6df;
    color: #776c66;
}

.delete-button {
    background: #f1dddd;
    color: #a56f6f;
}

/* =========================
   EMPTY STATE
========================= */

.empty {
    background: #fffdfb;
    border: 1px dashed #dfd1c8;
    border-radius: 18px;
    padding: 50px 25px;
    text-align: center;
    color: #988d87;
}

.empty strong {
    display: block;
    color: #655c57;
    font-size: 16px;
    margin-bottom: 7px;
}

/* =========================
   MODAL
========================= */

.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(64,52,47,.35);

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;
    z-index: 20;
}

.modal-backdrop.show {
    display: flex;
}

.modal {
    width: min(680px, 100%);
    max-height: 90vh;
    overflow-y: auto;

    background: #fffdfb;
    border: 1px solid #eadfd7;
    border-radius: 20px;

    padding: 25px;

    box-shadow: 0 20px 50px rgba(61,47,40,.18);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.modal-header h2 {
    margin: 0;
    font-size: 21px;
}

.close-button {
    border: none;
    background: #f2e9e4;
    color: #766b65;

    width: 32px;
    height: 32px;

    border-radius: 50%;

    cursor: pointer;
    font-size: 17px;
}

/* =========================
   FORM
========================= */

.form-group {
    margin-bottom: 16px;
}

label {
    display: block;
    font-size: 11px;
    font-weight: bold;
    color: #716762;
    margin-bottom: 7px;
}

input,
select,
textarea {
    width: 100%;

    border: 1px solid #e4d8d0;
    border-radius: 10px;

    background: #fffaf7;

    padding: 11px 12px;

    font-family: inherit;
    font-size: 13px;

    color: #4d4642;

    outline: none;
}

textarea {
    min-height: 270px;
    resize: vertical;
    line-height: 1.6;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #c9aaa4;
}

/* =========================
   MODAL BUTTONS
========================= */

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 9px;
    margin-top: 18px;
}

.cancel-button,
.save-button {
    border: none;
    border-radius: 9px;

    padding: 10px 15px;

    font-size: 12px;
    font-weight: bold;

    cursor: pointer;
}

.cancel-button {
    background: #eee7e1;
    color: #756b65;
}

.save-button {
    background: #c98787;
    color: white;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 1000px) {

    .notes-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

}

@media (max-width: 760px) {

    .sidebar {
        width: 180px;
    }

    .main {
        margin-left: 180px;
        padding: 28px 20px;
    }

    .notes-grid {
        grid-template-columns: 1fr;
    }

    .topbar {
        flex-direction: column;
    }

}

@media (max-width: 560px) {

    .sidebar {
        display: none;
    }

    .main {
        margin-left: 0;
        padding: 22px 16px;
    }

}

</style>
</head>

<body>

<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

    <div class="logo">
        classy
    </div>

    <div class="tagline">
        Your college life, organized.
    </div>

    <nav class="nav">

        <a href="index.html">
            Dashboard
        </a>

        <a href="courses.html">
            Courses
        </a>

        <a href="planner.html">
            Planner
        </a>

        <a href="study-sets.html">
            Study Sets
        </a>

        <a href="notes.html" class="active">
            Notes
        </a>

        <a href="ai.html">
            AI Assistant
        </a>

        <a href="settings.html">
            Settings
        </a>

    </nav>

</aside>


<!-- =========================
     MAIN
========================= -->

<main class="main">

    <div class="topbar">

        <div>

            <h1>
                Notes
            </h1>

            <p class="subtitle">
                Keep your class notes organized in one place. ✨
            </p>

        </div>

        <button
            class="new-note-button"
            id="newNoteButton"
        >
            + New Note
        </button>

    </div>


    <div class="toolbar">

        <input
            class="search"
            id="searchInput"
            type="search"
            placeholder="Search your notes..."
        >

        <select
            class="filter"
            id="courseFilter"
        >

            <option value="ALL">
                All Courses
            </option>

        </select>

    </div>


    <div id="notesContainer"></div>

</main>


<!-- =========================
     NOTE MODAL
========================= -->

<div
    class="modal-backdrop"
    id="noteModal"
>

    <div class="modal">

        <div class="modal-header">

            <h2 id="modalTitle">
                New Note
            </h2>

            <button
                class="close-button"
                id="closeModal"
            >
                ×
            </button>

        </div>


        <div class="form-group">

            <label for="noteTitle">
                Note Title
            </label>

            <input
                id="noteTitle"
                type="text"
                placeholder="e.g. Chapter 4 Review"
            >

        </div>


        <div class="form-group">

            <label for="noteCourse">
                Course
            </label>

            <select id="noteCourse"></select>

        </div>


        <div class="form-group">

            <label for="noteContent">
                Notes
            </label>

            <textarea
                id="noteContent"
                placeholder="Start writing your notes here..."
            ></textarea>

        </div>


        <div class="modal-actions">

            <button
                class="cancel-button"
                id="cancelModal"
            >
                Cancel
            </button>

            <button
                class="save-button"
                id="saveNoteButton"
            >
                Save Note
            </button>

        </div>

    </div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function () {

    /* =========================
       STORAGE
    ========================= */

    const STORAGE_KEY = "classyNotes";


    /* =========================
       DEFAULT COURSES
    ========================= */

    const defaultCourses = {

        "MATH1131": {
            name: "Calculus for Business",
            code: "Math 1131",
            color: "#d8b7b0"
        },

        "ENGLISH2367": {
            name: "Composition II",
            code: "English 2367",
            color: "#b8c5b0"
        },

        "HISTORY1112": {
            name: "European History",
            code: "History 1112",
            color: "#c8c0d8"
        },

        "GELAUNCH": {
            name: "GE Launch Seminar",
            code: "GE Launch",
            color: "#d8d0c4"
        }

    };


    let savedCourses = [];
    let notes = [];
    let editingId = null;


    /* =========================
       LOAD COURSES
    ========================= */

    function loadCourses() {

        try {

            savedCourses =
                JSON.parse(
                    localStorage.getItem("classyCourses") || "[]"
                );

            if (!Array.isArray(savedCourses)) {
                savedCourses = [];
            }

        } catch (error) {

            savedCourses = [];

        }

    }


    /* =========================
       LOAD NOTES
    ========================= */

    function loadNotes() {

        try {

            notes =
                JSON.parse(
                    localStorage.getItem(STORAGE_KEY) || "[]"
                );

            if (!Array.isArray(notes)) {
                notes = [];
            }

        } catch (error) {

            notes = [];

        }

    }


    /* =========================
       SAVE NOTES
    ========================= */

    function saveNotes() {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(notes)
        );

    }


    /* =========================
       GET ALL COURSES
    ========================= */

    function getCourses() {

        const courses =
            Object.keys(defaultCourses).map(function (key) {

                return {

                    key: key,

                    name:
                        defaultCourses[key].name,

                    code:
                        defaultCourses[key].code,

                    color:
                        defaultCourses[key].color

                };

            });


        savedCourses.forEach(function (course) {

            if (!course || !course.code) {
                return;
            }


            const key =
                course.code
                    .replace(/\s+/g, "")
                    .toUpperCase();


            const alreadyExists =
                courses.some(function (item) {

                    return item.key === key;

                });


            if (!alreadyExists) {

                courses.push({

                    key: key,

                    name:
                        course.name || course.code,

                    code:
                        course.code,

                    color:
                        course.color || "#d8b7b0"

                });

            }

        });


        return courses;

    }


    /* =========================
       FIND COURSE
    ========================= */

    function getCourse(courseCode) {

        const courses = getCourses();


        return courses.find(function (course) {

            return course.key === courseCode;

        }) || {

            key: courseCode,

            name:
                courseCode || "Unknown Course",

            code:
                courseCode || "",

            color:
                "#d8b7b0"

        };

    }


    /* =========================
       COURSE DROPDOWNS
    ========================= */

    function populateCourseDropdowns() {

        const courses = getCourses();


        const noteCourse =
            document.getElementById("noteCourse");


        const courseFilter =
            document.getElementById("courseFilter");


        noteCourse.innerHTML = "";


        courses.forEach(function (course) {

            const option =
                document.createElement("option");


            option.value =
                course.key;


            option.textContent =
                course.code +
                " — " +
                course.name;


            noteCourse.appendChild(option);

        });


        while (courseFilter.options.length > 1) {

            courseFilter.remove(1);

        }


        courses.forEach(function (course) {

            const option =
                document.createElement("option");


            option.value =
                course.key;


            option.textContent =
                course.code;


            courseFilter.appendChild(option);

        });

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHTML(value) {

        return String(value || "")

            .replace(/&/g, "&amp;")

            .replace(/</g, "&lt;")

            .replace(/>/g, "&gt;")

            .replace(/"/g, "&quot;")

            .replace(/'/g, "&#039;");

    }


    /* =========================
       FORMAT DATE
    ========================= */

    function formatDate(timestamp) {

        const date =
            new Date(timestamp);


        if (isNaN(date.getTime())) {
            return "";
        }


        return date.toLocaleDateString(
            undefined,
            {
                month: "short",
                day: "numeric",
                year: "numeric"
            }
        );

    }


    /* =========================
       RENDER NOTES
    ========================= */

    function renderNotes() {

        const container =
            document.getElementById(
                "notesContainer"
            );


        const searchTerm =
            document
                .getElementById("searchInput")
                .value
                .trim()
                .toLowerCase();


        const selectedCourse =
            document
                .getElementById("courseFilter")
                .value;


        const filtered =
            notes

                .filter(function (note) {

                    const matchesCourse =
                        selectedCourse === "ALL" ||
                        note.courseCode === selectedCourse;


                    const searchable =
                        (note.title || "") +
                        " " +
                        (note.content || "");


                    const matchesSearch =
                        !searchTerm ||
                        searchable
                            .toLowerCase()
                            .includes(searchTerm);


                    return (
                        matchesCourse &&
                        matchesSearch
                    );

                })


                .sort(function (a, b) {

                    return (
                        (b.updatedAt || b.createdAt || 0) -
                        (a.updatedAt || a.createdAt || 0)
                    );

                });


        /* =========================
           EMPTY STATE
        ========================= */

        if (filtered.length === 0) {

            container.innerHTML = `

                <div class="empty">

                    <strong>
                        ${
                            notes.length
                            ? "No notes found"
                            : "No notes yet"
                        }
                    </strong>

                    <span>
                        ${
                            notes.length
                            ? "Try a different search or course filter."
                            : "Create your first note to get started. ✨"
                        }
                    </span>

                </div>

            `;

            return;

        }


        /* =========================
           CREATE GRID
        ========================= */

        const grid =
            document.createElement("div");


        grid.className =
            "notes-grid";


        filtered.forEach(function (note) {

            const course =
                getCourse(note.courseCode);


            const card =
                document.createElement("article");


            card.className =
                "note-card";


            card.innerHTML = `

                <div
                    class="course-pill"
                    style="
                        background:${escapeHTML(course.color)};
                        color:#625954;
                    "
                >
                    ${escapeHTML(course.code)}
                </div>


                <h2 class="note-title">

                    ${escapeHTML(
                        note.title ||
                        "Untitled Note"
                    )}

                </h2>


                <div class="note-preview">

                    ${escapeHTML(
                        note.content ||
                        "No content yet."
                    )}

                </div>


                <div class="note-date">

                    Updated
                    ${escapeHTML(
                        formatDate(
                            note.updatedAt ||
                            note.createdAt
                        )
                    )}

                </div>


                <div class="note-actions">

                    <button
                        class="small-button edit-button"
                        data-action="edit"
                        data-id="${escapeHTML(note.id)}"
                    >
                        Edit
                    </button>


                    <button
                        class="small-button delete-button"
                        data-action="delete"
                        data-id="${escapeHTML(note.id)}"
                    >
                        Delete
                    </button>

                </div>

            `;


            grid.appendChild(card);

        });


        container.innerHTML = "";

        container.appendChild(grid);

    }


    /* =========================
       OPEN NEW NOTE
    ========================= */

    function openNewNote() {

        editingId = null;


        document.getElementById(
            "modalTitle"
        ).textContent =
            "New Note";


        document.getElementById(
            "noteTitle"
        ).value = "";


        document.getElementById(
            "noteContent"
        ).value = "";


        if (
            document.getElementById(
                "noteCourse"
            ).options.length
        ) {

            document.getElementById(
                "noteCourse"
            ).selectedIndex = 0;

        }


        document.getElementById(
            "noteModal"
        ).classList.add("show");


        setTimeout(function () {

            document.getElementById(
                "noteTitle"
            ).focus();

        }, 50);

    }


    /* =========================
       OPEN EDIT NOTE
    ========================= */

    function openEditNote(id) {

        const note =
            notes.find(function (item) {

                return item.id === id;

            });


        if (!note) {
            return;
        }


        editingId = id;


        document.getElementById(
            "modalTitle"
        ).textContent =
            "Edit Note";


        document.getElementById(
            "noteTitle"
        ).value =
            note.title || "";


        document.getElementById(
            "noteCourse"
        ).value =
            note.courseCode || "";


        document.getElementById(
            "noteContent"
        ).value =
            note.content || "";


        document.getElementById(
            "noteModal"
        ).classList.add("show");


        setTimeout(function () {

            document.getElementById(
                "noteTitle"
            ).focus();

        }, 50);

    }


    /* =========================
       CLOSE MODAL
    ========================= */

    function closeModal() {

        document.getElementById(
            "noteModal"
        ).classList.remove("show");


        editingId = null;

    }


    /* =========================
       SAVE NOTE
    ========================= */

    function saveNote() {

        const title =
            document
                .getElementById("noteTitle")
                .value
                .trim();


        const courseCode =
            document
                .getElementById("noteCourse")
                .value;


        const content =
            document
                .getElementById("noteContent")
                .value
                .trim();


        if (!title) {

            alert(
                "Please give your note a title."
            );

            return;

        }


        if (!courseCode) {

            alert(
                "Please choose a course."
            );

            return;

        }


        /* =========================
           EDIT EXISTING NOTE
        ========================= */

        if (editingId) {

            const note =
                notes.find(function (item) {

                    return item.id === editingId;

                });


            if (note) {

                note.title =
                    title;

                note.courseCode =
                    courseCode;

                note.content =
                    content;

                note.updatedAt =
                    Date.now();

            }

        }


        /* =========================
           CREATE NEW NOTE
        ========================= */

        else {

            notes.push({

                id:
                    "note_" +
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .slice(2, 8),

                title:
                    title,

                courseCode:
                    courseCode,

                content:
                    content,

                createdAt:
                    Date.now(),

                updatedAt:
                    Date.now()

            });

        }


        saveNotes();

        renderNotes();

        closeModal();

    }


    /* =========================
       DELETE NOTE
    ========================= */

    function deleteNote(id) {

        const note =
            notes.find(function (item) {

                return item.id === id;

            });


        if (!note) {
            return;
        }


        const confirmed =
            confirm(
                'Delete "' +
                (note.title || "Untitled Note") +
                '"?'
            );


        if (!confirmed) {
            return;
        }


        notes =
            notes.filter(function (item) {

                return item.id !== id;

            });


        saveNotes();

        renderNotes();

    }


    /* =========================
       BUTTON EVENTS
    ========================= */

    document
        .getElementById("newNoteButton")
        .addEventListener(
            "click",
            openNewNote
        );


    document
        .getElementById("closeModal")
        .addEventListener(
            "click",
            closeModal
        );


    document
        .getElementById("cancelModal")
        .addEventListener(
            "click",
            closeModal
        );


    document
        .getElementById("saveNoteButton")
        .addEventListener(
            "click",
            saveNote
        );


    document
        .getElementById("searchInput")
        .addEventListener(
            "input",
            renderNotes
        );


    document
        .getElementById("courseFilter")
        .addEventListener(
            "change",
            renderNotes
        );


    /* =========================
       CLICK OUTSIDE MODAL
    ========================= */

    document
        .getElementById("noteModal")
        .addEventListener(
            "click",
            function (event) {

                if (
                    event.target === this
                ) {

                    closeModal();

                }

            }
        );


    /* =========================
       EDIT + DELETE BUTTONS
    ========================= */

    document
        .getElementById("notesContainer")
        .addEventListener(
            "click",
            function (event) {

                const button =
                    event.target.closest(
                        "button"
                    );


                if (!button) {
                    return;
                }


                const id =
                    button.dataset.id;


                const action =
                    button.dataset.action;


                if (
                    action === "edit"
                ) {

                    openEditNote(id);

                }


                if (
                    action === "delete"
                ) {

                    deleteNote(id);

                }

            }
        );


    /* =========================
       KEYBOARD SHORTCUTS
    ========================= */

    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Escape"
            ) {

                closeModal();

            }


            if (
                (event.metaKey ||
                 event.ctrlKey) &&
                event.key === "Enter"
            ) {

                const modal =
                    document.getElementById(
                        "noteModal"
                    );


                if (
                    modal.classList.contains(
                        "show"
                    )
                ) {

                    saveNote();

                }

            }

        }
    );


    /* =========================
       STARTUP
    ========================= */

    loadCourses();

    loadNotes();

    populateCourseDropdowns();

    renderNotes();

});

</script>
