<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Sets — Classy</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8f5f0;
    color: #4d4642;
}

/* SIDEBAR */
.sidebar {
    width: 230px;
    background: white;
    border-right: 1px solid #e7e1da;
    min-height: 100vh;
    padding: 28px 18px;
    position: fixed;
    left: 0;
    top: 0;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #c98787;
    margin-bottom: 3px;
}

.tagline {
    font-size: 12px;
    color: #999;
    margin-bottom: 35px;
}

.nav a {
    display: block;
    text-decoration: none;
    color: #665e59;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 15px;
    margin-bottom: 5px;
}

.nav a:hover,
.nav a.active {
    background: #f3e4e1;
    color: #b56f70;
}

/* MAIN */
.main {
    margin-left: 230px;
    padding: 40px;
    max-width: 1400px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.header h1 {
    margin: 0;
    font-size: 30px;
}

.header p {
    margin: 8px 0 0;
    color: #8f8580;
}

.primary-button {
    border: none;
    background: #c98787;
    color: white;
    padding: 13px 19px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

.primary-button:hover {
    opacity: 0.9;
}

/* STUDY SET GRID */
.set-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 22px;
}

.set-card {
    background: #fff;
    border: 1px solid #ebe4dd;
    border-radius: 18px;
    padding: 23px;
    box-shadow: 0 4px 15px rgba(90, 75, 65, 0.06);
    position: relative;
}

.color-bar {
    height: 7px;
    border-radius: 10px;
    margin-bottom: 18px;
}

.set-card h2 {
    margin: 0 0 7px;
    font-size: 21px;
}

.course-label {
    font-size: 13px;
    color: #918680;
    margin-bottom: 16px;
}

.card-count {
    font-size: 13px;
    color: #7f746e;
    margin-bottom: 20px;
}

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.action-button {
    border: none;
    padding: 9px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
}

.study-button {
    background: #f3e4e1;
    color: #a66f70;
}

.manage-button {
    background: #eee9f2;
    color: #766b82;
}

.delete-button {
    background: #f2eeee;
    color: #a77777;
}

.action-button:hover {
    opacity: 0.8;
}

/* EMPTY STATE */
.empty-state {
    background: white;
    border: 1px solid #ebe4dd;
    border-radius: 18px;
    padding: 60px 30px;
    text-align: center;
}

.empty-state h2 {
    margin-top: 0;
}

.empty-state p {
    color: #918680;
}

/* MODAL */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(55, 48, 44, 0.35);
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
}

.modal {
    background: white;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 15px 45px rgba(50, 40, 35, 0.18);
}

.modal h2 {
    margin-top: 0;
}

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 7px;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #ddd3cc;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    background: #fffdfb;
}

.form-group textarea {
    min-height: 100px;
    resize: vertical;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 22px;
}

.secondary-button {
    border: none;
    background: #eee9e5;
    color: #655d58;
    padding: 11px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

/* CARD MANAGEMENT */
.card-editor {
    border: 1px solid #e9e0da;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 12px;
    background: #fffaf7;
}

.card-editor-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
}

.card-editor strong {
    font-size: 13px;
}

.small-delete {
    border: none;
    background: transparent;
    color: #a77777;
    cursor: pointer;
    font-size: 12px;
}

.card-editor textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd3cc;
    border-radius: 9px;
    font-family: inherit;
    resize: vertical;
    margin-bottom: 8px;
}

.add-card-button {
    width: 100%;
    border: 1px dashed #cdbfb7;
    background: #fffdfb;
    color: #9a7770;
    padding: 11px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

/* STUDY MODE */
.study-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #f8f5f0;
    z-index: 2000;
    padding: 35px;
}

.study-container {
    max-width: 850px;
    margin: 0 auto;
}

.study-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.study-top h2 {
    margin: 0;
}

.close-study {
    border: none;
    background: white;
    border: 1px solid #e4dcd5;
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
}

.progress-text {
    text-align: center;
    color: #8d817b;
    margin-bottom: 15px;
}

.flashcard {
    background: white;
    border: 1px solid #e8dfd8;
    border-radius: 24px;
    min-height: 360px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 45px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 7px 25px rgba(80, 65, 55, 0.08);
}

.flashcard-content {
    max-width: 700px;
}

.flashcard-label {
    font-size: 12px;
    color: #b18a83;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 18px;
}

.flashcard-text {
    font-size: 28px;
    line-height: 1.4;
}

.study-buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 22px;
}

.study-buttons button {
    border: none;
    padding: 13px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
}

.correct-button {
    background: #dce8d8;
    color: #587052;
}

.learning-button {
    background: #eee3d7;
    color: #826d5a;
}

@media (max-width: 800px) {
    .sidebar {
        width: 190px;
    }

    .main {
        margin-left: 190px;
        padding: 25px;
    }

    .header {
        align-items: flex-start;
        gap: 20px;
        flex-direction: column;
    }

    .study-overlay {
        padding: 20px;
    }
}

@media (max-width: 600px) {
    .sidebar {
        position: static;
        width: 100%;
        min-height: auto;
    }

    .main {
        margin-left: 0;
    }

    .nav {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<aside class="sidebar">
    <div class="logo">Classy</div>
    <div class="tagline">Your college life, organized.</div>

    <nav class="nav">
        <a href="index.html">Dashboard</a>
        <a href="courses.html">Courses</a>
        <a href="planner.html">Planner</a>
        <a href="study-sets.html" class="active">Study Sets</a>
        <a href="notes.html">Notes</a>
        <a href="ai.html">AI Assistant</a>
        <a href="settings.html">Settings</a>
    </nav>
</aside>

<main class="main">

    <div class="header">
        <div>
            <h1>Study Sets</h1>
            <p>Review your material with flashcards.</p>
        </div>

        <button class="primary-button" onclick="openNewSetModal()">
            + New Study Set
        </button>
    </div>

    <div id="setGrid" class="set-grid"></div>

</main>


<!-- NEW SET MODAL -->
<div class="modal-overlay" id="setModal">
    <div class="modal">

        <h2 id="setModalTitle">Create Study Set</h2>

        <div class="form-group">
            <label for="setName">Study Set Name</label>
            <input id="setName" type="text" placeholder="e.g. Calculus Chapter 1">
        </div>

        <div class="form-group">
            <label for="setCourse">Course</label>
            <select id="setCourse"></select>
        </div>

        <div class="form-group">
            <label for="setColor">Color</label>
            <select id="setColor">
                <option value="#d8b7b0">Dusty Rose</option>
                <option value="#b8c5b0">Sage Green</option>
                <option value="#d8d0c4">Warm Beige</option>
                <option value="#c8c0d8">Soft Lavender</option>
            </select>
        </div>

        <div class="modal-actions">
            <button class="secondary-button" onclick="closeSetModal()">
                Cancel
            </button>

            <button class="primary-button" onclick="saveStudySet()">
                Save Study Set
            </button>
        </div>

    </div>
</div>


<!-- MANAGE CARDS MODAL -->
<div class="modal-overlay" id="manageModal">
    <div class="modal">

        <h2 id="manageTitle">Manage Cards</h2>

        <div id="cardEditors"></div>

        <button class="add-card-button" onclick="addCardEditor()">
            + Add Card
        </button>

        <div class="modal-actions">
            <button class="secondary-button" onclick="closeManageModal()">
                Cancel
            </button>

            <button class="primary-button" onclick="saveCards()">
                Save Cards
            </button>
        </div>

    </div>
</div>


<!-- STUDY MODE -->
<div class="study-overlay" id="studyOverlay">

    <div class="study-container">

        <div class="study-top">
            <h2 id="studyTitle">Study Mode</h2>

            <button class="close-study" onclick="closeStudyMode()">
                ✕ Exit
            </button>
        </div>

        <div class="progress-text" id="studyProgress">
            Card 1 of 1
        </div>

        <div class="flashcard" onclick="flipCard()">

            <div class="flashcard-content">

                <div class="flashcard-label" id="flashcardLabel">
                    Question
                </div>

                <div class="flashcard-text" id="flashcardText">
                    Click to begin
                </div>

            </div>

        </div>

        <div class="study-buttons">
            <button class="learning-button" onclick="stillLearning()">
                Still Learning
            </button>

            <button class="correct-button" onclick="markCorrect()">
                ✓ Got It
            </button>
        </div>

    </div>

</div>


<script>

/* =========================
   COURSE DATABASE
========================= */

const defaultCourses = {
    MATH1131: {
        name: "Calculus for Business",
        code: "Math 1131",
        color: "#d8b7b0"
    },

    ENGLISH2367: {
        name: "Composition II",
        code: "English 2367",
        color: "#b8c5b0"
    },

    HISTORY1112: {
        name: "European History",
        code: "History 1112",
        color: "#c8c0d8"
    },

    GELAUNCH: {
        name: "GE Launch Seminar",
        code: "GE Launch",
        color: "#d8d0c4"
    }
};


/* =========================
   STORAGE
========================= */

const STORAGE_KEY = "classyStudySets";

let studySets = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
);

let editingSetId = null;
let managingSetId = null;

let currentStudySet = null;
let currentCardIndex = 0;
let cardFlipped = false;


/* =========================
   HELPERS
========================= */

function saveSets() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(studySets)
    );
}


function getCourses() {

    const courses = { ...defaultCourses };

    const savedCourses = JSON.parse(
        localStorage.getItem("classyCourses") || "[]"
    );

    savedCourses.forEach(course => {

        if (!course.code) return;

        const normalizedCode = course.code
            .replace(/\s+/g, "")
            .toUpperCase();

        courses[normalizedCode] = {
            name: course.name,
            code: course.code,
            color: course.color || "#d8b7b0"
        };

    });

    return courses;
}


function getCourseName(code) {

    const courses = getCourses();

    return courses[code]?.code || code || "No Course";
}


function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   COURSE DROPDOWN
========================= */

function populateCourseDropdown() {

    const select = document.getElementById("setCourse");

    select.innerHTML = "";

    const courses = getCourses();

    Object.entries(courses).forEach(([code, course]) => {

        const option = document.createElement("option");

        option.value = code;
        option.textContent = course.code + " — " + course.name;

        select.appendChild(option);

    });
}


/* =========================
   RENDER SETS
========================= */

function renderStudySets() {

    const grid = document.getElementById("setGrid");

    if (studySets.length === 0) {

        grid.innerHTML = `
            <div class="empty-state">
                <h2>No study sets yet 📚</h2>
                <p>Create your first study set to start studying.</p>
                <button class="primary-button" onclick="openNewSetModal()">
                    + Create Study Set
                </button>
            </div>
        `;

        return;
    }

    grid.innerHTML = studySets.map(set => {

        const courses = getCourses();

        const course = courses[set.courseCode];

        const courseColor =
            set.color ||
            course?.color ||
            "#d8b7b0";

        return `
            <div class="set-card">

                <div
                    class="color-bar"
                    style="background:${courseColor};"
                ></div>

                <h2>
                    ${escapeHtml(set.name)}
                </h2>

                <div class="course-label">
                    ${escapeHtml(
                        course?.code ||
                        set.courseCode ||
                        "No Course"
                    )}
                </div>

                <div class="card-count">
                    ${set.cards.length}
                    ${set.cards.length === 1 ? "card" : "cards"}
                </div>

                <div class="actions">

                    <button
                        class="action-button study-button"
                        onclick="startStudy('${set.id}')"
                    >
                        Study
                    </button>

                    <button
                        class="action-button manage-button"
                        onclick="openManageCards('${set.id}')"
                    >
                        Manage Cards
                    </button>

                    <button
                        class="action-button delete-button"
                        onclick="deleteStudySet('${set.id}')"
                    >
                        Delete
                    </button>

                </div>

            </div>
        `;

    }).join("");
}


/* =========================
   NEW STUDY SET
========================= */

function openNewSetModal() {

    editingSetId = null;

    document.getElementById("setModalTitle").textContent =
        "Create Study Set";

    document.getElementById("setName").value = "";

    populateCourseDropdown();

    document.getElementById("setColor").value =
        "#d8b7b0";

    document.getElementById("setModal").style.display =
        "flex";
}


function closeSetModal() {

    document.getElementById("setModal").style.display =
        "none";

    editingSetId = null;
}


function saveStudySet() {

    const name =
        document.getElementById("setName").value.trim();

    const courseCode =
        document.getElementById("setCourse").value;

    const color =
        document.getElementById("setColor").value;

    if (!name) {

        alert("Please enter a study set name.");

        return;
    }


    if (editingSetId) {

        const set = studySets.find(
            item => item.id === editingSetId
        );

        if (set) {

            set.name = name;
            set.courseCode = courseCode;
            set.color = color;

        }

    } else {

        studySets.push({

            id:
                Date.now().toString() +
                Math.random().toString(36).slice(2),

            name: name,

            courseCode: courseCode,

            color: color,

            cards: []

        });

    }

    saveSets();

    renderStudySets();

    closeSetModal();
}


/* =========================
   DELETE SET
========================= */

function deleteStudySet(id) {

    const set = studySets.find(
        item => item.id === id
    );

    if (!set) return;

    const confirmed = confirm(
        `Delete "${set.name}"? This cannot be undone.`
    );

    if (!confirmed) return;

    studySets = studySets.filter(
        item => item.id !== id
    );

    saveSets();

    renderStudySets();
}


/* =========================
   MANAGE CARDS
========================= */

function openManageCards(id) {

    const set = studySets.find(
        item => item.id === id
    );

    if (!set) return;

    managingSetId = id;

    document.getElementById("manageTitle").textContent =
        `Manage Cards — ${set.name}`;

    renderCardEditors();

    document.getElementById("manageModal").style.display =
        "flex";
}


function closeManageModal() {

    document.getElementById("manageModal").style.display =
        "none";

    managingSetId = null;
}


function renderCardEditors() {

    const set = studySets.find(
        item => item.id === managingSetId
    );

    if (!set) return;

    const container =
        document.getElementById("cardEditors");

    if (set.cards.length === 0) {

        container.innerHTML = `
            <p style="color:#918680;">
                No cards yet. Add your first flashcard below.
            </p>
        `;

        return;
    }


    container.innerHTML =
        set.cards.map((card, index) => {

            return `
                <div class="card-editor">

                    <div class="card-editor-top">

                        <strong>
                            Card ${index + 1}
                        </strong>

                        <button
                            class="small-delete"
                            onclick="removeCardEditor(${index})"
                        >
                            Delete
                        </button>

                    </div>

                    <textarea
                        class="question-input"
                        data-index="${index}"
                        placeholder="Question"
                        rows="3"
                    >${escapeHtml(card.question)}</textarea>

                    <textarea
                        class="answer-input"
                        data-index="${index}"
                        placeholder="Answer"
                        rows="3"
                    >${escapeHtml(card.answer)}</textarea>

                </div>
            `;

        }).join("");
}


function addCardEditor() {

    const set = studySets.find(
        item => item.id === managingSetId
    );

    if (!set) return;

    set.cards.push({

        id:
            Date.now().toString() +
            Math.random().toString(36).slice(2),

        question: "",

        answer: ""

    });

    renderCardEditors();
}


function removeCardEditor(index) {

    const set = studySets.find(
        item => item.id === managingSetId
    );

    if (!set) return;

    set.cards.splice(index, 1);

    renderCardEditors();
}


function saveCards() {

    const set = studySets.find(
        item => item.id === managingSetId
    );

    if (!set) return;

    const questions =
        document.querySelectorAll(".question-input");

    const answers =
        document.querySelectorAll(".answer-input");


    questions.forEach((input, index) => {

        if (set.cards[index]) {

            set.cards[index].question =
                input.value.trim();

        }

    });


    answers.forEach((input, index) => {

        if (set.cards[index]) {

            set.cards[index].answer =
                input.value.trim();

        }

    });


    set.cards = set.cards.filter(card =>
        card.question || card.answer
    );


    saveSets();

    renderStudySets();

    closeManageModal();
}


/* =========================
   STUDY MODE
========================= */

function startStudy(id) {

    const set = studySets.find(
        item => item.id === id
    );

    if (!set) return;

    if (set.cards.length === 0) {

        alert(
            "This study set has no cards yet. Click Manage Cards to add some."
        );

        return;
    }

    currentStudySet = set;

    currentCardIndex = 0;

    cardFlipped = false;

    document.getElementById("studyTitle").textContent =
        set.name;

    document.getElementById("studyOverlay").style.display =
        "block";

    renderStudyCard();
}


function closeStudyMode() {

    document.getElementById("studyOverlay").style.display =
        "none";

    currentStudySet = null;
}


function renderStudyCard() {

    if (!currentStudySet) return;

    const card =
        currentStudySet.cards[currentCardIndex];

    if (!card) {

        closeStudyMode();

        return;
    }

    document.getElementById("studyProgress").textContent =
        `Card ${currentCardIndex + 1} of ${currentStudySet.cards.length}`;

    document.getElementById("flashcardLabel").textContent =
        cardFlipped ? "Answer" : "Question";

    document.getElementById("flashcardText").textContent =
        cardFlipped
            ? card.answer
            : card.question;
}


function flipCard() {

    if (!currentStudySet) return;

    cardFlipped = !cardFlipped;

    renderStudyCard();
}


function nextStudyCard() {

    if (!currentStudySet) return;

    if (
        currentCardIndex >=
        currentStudySet.cards.length - 1
    ) {

        alert("You finished this study set! 🎉");

        closeStudyMode();

        return;
    }

    currentCardIndex++;

    cardFlipped = false;

    renderStudyCard();
}


function markCorrect() {

    nextStudyCard();
}


function stillLearning() {

    nextStudyCard();
}


/* =========================
   STARTUP
========================= */

document.addEventListener("DOMContentLoaded", function () {

    populateCourseDropdown();
    renderStudySets();

    const setGrid = document.getElementById("setGrid");

    setGrid.addEventListener("click", function (event) {

        const button = event.target.closest("button");

        if (!button) return;

        const setCard = button.closest(".set-card");

        if (!setCard) return;

        const buttons = setCard.querySelectorAll("button");

        const buttonIndex = Array.from(buttons).indexOf(button);

        const set = studySets[
            Array.from(setGrid.querySelectorAll(".set-card")).indexOf(setCard)
        ];

        if (!set) return;

        if (buttonIndex === 0) {
            startStudy(set.id);
        }

        if (buttonIndex === 1) {
            openManageCards(set.id);
        }

        if (buttonIndex === 2) {
            deleteStudySet(set.id);
        }

    });

});

</script>

<script src="theme.js"></script>
</body>
</html>
